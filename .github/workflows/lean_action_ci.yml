name: Lean Action CI

on:
  push:
    paths:
      - '**.lean'
      - 'Tests/**'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/lean_action_ci.yml'
  pull_request:
    paths:
      - '**.lean'
      - 'Tests/**'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/lean_action_ci.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      # lake test checks the golden outputs against gc when Go 1.26 or later is installed.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - uses: leanprover/lean-action@v1
